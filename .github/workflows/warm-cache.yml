name: Warm PitchIQ Cache

on:
  schedule:
    - cron: "0 12,15,18,21 * * *"
  workflow_dispatch:

jobs:
  warm-cache:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger cache refresh
        run: |
          curl -v -X POST "https://www.pitchiq.site/api/refresh-homepage-secret" \
            -H "Authorization: Bearer ${{ secrets.REFRESH_KEY }}"
